version: 2
updates:
  - package-ecosystem: cargo
    directory: /credential-core
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      crypto-core:
        patterns:
          - aes
          - cipher
          - des
          - ecb

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
