name: Release extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: node scripts/verify-release-version.mjs "${{ github.ref_name }}"

      - name: Typecheck
        run: npm run typecheck

      - name: Build extension
        run: npm run build

      - name: Create installable ZIP and checksum
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          archive="UniPass-${TAG_NAME}.zip"
          (cd dist && zip -r "../${archive}" .)
          sha256sum "${archive}" > "${archive}.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            UniPass-${{ github.ref_name }}.zip
            UniPass-${{ github.ref_name }}.zip.sha256