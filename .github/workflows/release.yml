name: Release extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Rust dependency security audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Audit Cargo.lock with RustSec
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: credential-core

  verify:
    name: Verify release and upload artifact
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Chrome for MV3 smoke test
        id: setup-chrome
        uses: browser-actions/setup-chrome@39ce663831f86d2ea36cbda0a8143709cdfcc410 # v2.2.0
        with:
          install-dependencies: true

      - name: Set up Rust credential core toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
          rustup component add rustfmt clippy --toolchain 1.98.1

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: node scripts/verify-release-version.mjs "${{ github.ref_name }}"

      - name: Verify
        run: |
          for attempt in 1 2 3; do
            if npm run verify; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 5
          done

      - name: Verify reproducible WASM release build
        run: npm run verify:wasm-reproducible

      - name: Run automated Chrome smoke
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROME_SMOKE_NO_SANDBOX: "true"
          CHROME_SMOKE_SKIP_RESTART: "true"
        run: xvfb-run --auto-servernum npm run smoke:chrome

      - name: Upload verified unpacked extension artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unipass-release-dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Package and publish release
    needs: [dependency-audit, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified extension artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unipass-release-dist
          path: dist

      - name: Create deterministic-content release ZIP and checksum
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          archive="UniPass-${TAG_NAME}.zip"
          find dist -type f -exec touch -d '1980-01-01 00:00:00 UTC' {} +
          (cd dist && find . -type f -printf '%P\n' | LC_ALL=C sort | zip -X -q -@ "../${archive}")
          sha256sum "${archive}" > "${archive}.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            UniPass-${{ github.ref_name }}.zip
            UniPass-${{ github.ref_name }}.zip.sha256
