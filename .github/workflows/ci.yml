name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Governance, audit, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust credential core toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Upload unpacked extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: unipass-extension
          path: dist/
          if-no-files-found: error
