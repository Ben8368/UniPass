name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Rust dependency security audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Audit Cargo.lock with RustSec
        uses: rustsec/audit-check@v2
        with:
          working-directory: credential-core

  verify:
    name: Governance, audit, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust credential core toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
          rustup component add rustfmt clippy --toolchain 1.98.1

      - name: Install dependencies
        run: npm ci

      - name: Rust format
        run: cargo fmt --check --manifest-path credential-core/Cargo.toml

      - name: Rust native tests
        run: cargo test --locked --manifest-path credential-core/Cargo.toml

      - name: Rust WASM clippy
        run: cargo clippy --locked --target wasm32-unknown-unknown --manifest-path credential-core/Cargo.toml -- -D warnings

      - name: Rust release build
        run: cargo build --locked --release --target wasm32-unknown-unknown --manifest-path credential-core/Cargo.toml

      - name: Verify
        run: npm run verify

      - name: Upload unpacked extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: unipass-extension
          path: dist/
          if-no-files-found: error
