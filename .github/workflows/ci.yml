name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Rust dependency security audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit Cargo.lock with RustSec
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: credential-core

  verify:
    name: Governance, Rust QA, build and Chrome smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Chrome for MV3 smoke test
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          install-dependencies: true

      - name: Set up Rust credential core toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
          rustup component add rustfmt clippy --toolchain 1.98.1

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Verify reproducible WASM release build
        run: npm run verify:wasm-reproducible

      - name: Run automated Chrome smoke
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROME_SMOKE_NO_SANDBOX: "true"
          CHROME_SMOKE_SKIP_RESTART: "true"
        run: xvfb-run --auto-servernum npm run smoke:chrome

      - name: Upload unpacked extension artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unipass-extension
          path: dist/
          if-no-files-found: error

  hardened:
    name: Hardened build, audit, diversity and Chrome smoke
    needs: [dependency-audit, verify]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Chrome for MV3 smoke test
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          install-dependencies: true

      - name: Set up Rust credential core toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
          rustup component add rustfmt clippy --toolchain 1.98.1

      - name: Install pinned Binaryen
        shell: bash
        env:
          BINARYEN_VERSION: "131"
          BINARYEN_SHA256: "b5bf1f0eaf17c63ee588ff7a5954dc8f6ce2c26989051c66f24dfe9ece3e46db"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          curl --fail --location --retry 3 --silent --show-error \
            --output "$archive" \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          echo "$BINARYEN_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          binaryen_bin="$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin"
          echo "$binaryen_bin" >> "$GITHUB_PATH"
          export PATH="$binaryen_bin:$PATH"
          wasm-opt --version

      - name: Install dependencies
        run: npm ci

      - name: Verify hardened build
        env:
          UNIPASS_HARDEN_SEED: ci-hardened-v1
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROME_SMOKE_NO_SANDBOX: "true"
          CHROME_SMOKE_SKIP_RESTART: "true"
        run: xvfb-run --auto-servernum npm run verify:hardened

      - name: Upload hardened unpacked extension artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unipass-hardened-extension
          path: dist/
          if-no-files-found: error
