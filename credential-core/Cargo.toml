[package]
name = "credential-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes = { version = "0.8.4", features = ["zeroize"] }
base64 = "0.23.1"
cipher = { version = "0.4.4", features = ["alloc", "block-padding", "zeroize"] }
des = { version = "0.8.1", features = ["zeroize"] }
ecb = { version = "0.1.2", features = ["alloc", "block-padding"] }
md-5 = "0.11.0"
zeroize = { version = "1.8.1", features = ["alloc"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
