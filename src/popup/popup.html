<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UniPass</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app-window">
      <header class="topbar">
        <div class="window-brand">
          <img src="icons/icon48.png" alt="" />
          <div class="brand-copy">
            <h1>UniPass</h1>
            <p>安全凭据助手</p>
          </div>
        </div>
        <div class="window-controls">
          <button id="sessionBadge" class="session-badge pending" type="button" title="UniPass 登录状态" disabled>
            <span class="session-dot" aria-hidden="true"></span>
            <strong id="identity">检查中</strong>
          </button>
          <button id="themeToggle" class="icon-button theme-toggle" type="button" title="切换浅色模式" aria-label="切换浅色模式">
            <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5" /><path d="M12 2.5v2M12 19.5v2M4.4 4.4l1.4 1.4M18.2 18.2l1.4 1.4M2.5 12h2M19.5 12h2M4.4 19.6l1.4-1.4M18.2 5.8l1.4-1.4" /></svg>
            <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 15.3A7.8 7.8 0 0 1 8.7 4.6 8.2 8.2 0 1 0 19.4 15.3Z" /></svg>
          </button>
          <button id="pluginVersionSettingsButton" class="icon-button" type="button" title="构建版本信息" aria-label="构建版本信息" aria-controls="versionSettingsDialog" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z" /><path d="m19.4 15 .1.1-1.5 2.6-.2-.1a2.2 2.2 0 0 0-2.2 0l-.2.1-1.5-2.6.1-.1a2.2 2.2 0 0 0 0-2.5l-.1-.1 1.5-2.6.2.1a2.2 2.2 0 0 0 2.2 0l.2-.1 1.5 2.6-.1.1a2.2 2.2 0 0 0 0 2.5Z" /></svg>
          </button>
          <button id="openPortal" class="icon-button" type="button" title="打开 UniPass 门户" aria-label="打开 UniPass 门户">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M14 5h5v5M19 5l-8 8M18 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" />
            </svg>
          </button>
        </div>
      </header>

      <main>
        <nav class="tabs" aria-label="凭据来源">
          <button class="tab active" type="button" data-view="current" aria-selected="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H4zM9 20h6M12 16v4" /></svg>
            <span>当前页面</span>
          </button>
          <button class="tab" type="button" data-view="apps" aria-selected="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1" /><rect x="14" y="4" width="6" height="6" rx="1" /><rect x="4" y="14" width="6" height="6" rx="1" /><rect x="14" y="14" width="6" height="6" rx="1" /></svg>
            <span>全部应用</span>
          </button>
        </nav>

        <div class="content-area">
          <section id="currentView" class="view">
            <div class="view-heading">
              <div>
                <span class="eyebrow">ACTIVE TAB</span>
                <h2>当前页面账号</h2>
              </div>
              <div class="host-chip">
                <span aria-hidden="true"></span>
                <p id="pageHost">正在识别页面</p>
              </div>
              <button id="refreshCatalog" class="icon-button" type="button" title="同步账号目录" aria-label="同步账号目录">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.8-4.2L3 9M4 13a8 8 0 0 0 14.8 4.2L21 15M3 4v5h5M21 20v-5h-5" /></svg>
              </button>
            </div>
            <div id="currentAccounts" class="list" aria-live="polite"></div>
          </section>

          <section id="appsView" class="view hidden">
            <form id="searchForm" class="search">
              <label class="search-field" for="searchInput">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="m16 16 4 4" /></svg>
                <input id="searchInput" type="search" autocomplete="off" placeholder="搜索应用名称" aria-label="搜索应用" />
              </label>
              <button type="submit">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 12 3 3 5-6" /></svg>
                搜索
              </button>
            </form>
            <div id="appsListHeading" class="list-heading">
              <span>应用目录</span>
              <small>选择应用以查看账号</small>
            </div>
            <button id="backToApps" class="link-button hidden" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
              返回应用列表
            </button>
            <div id="apps" class="list" aria-live="polite"></div>
            <div id="appAccounts" class="list hidden" aria-live="polite"></div>
          </section>

          <section id="credentialPanel" class="credential hidden" aria-live="polite">
            <div class="credential-heading">
              <div class="credential-title">
                <span class="credential-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2" /><path d="M8 10V7a4 4 0 0 1 8 0v3" /></svg>
                </span>
                <div>
                  <h2>临时凭据</h2>
                  <p>仅保存在当前弹窗内存中</p>
                </div>
              </div>
              <span id="credentialCountdown" class="countdown"></span>
            </div>
            <label for="credentialUsername">账号</label>
            <div class="field-row">
              <input id="credentialUsername" readonly />
              <button id="copyUsername" type="button">复制</button>
            </div>
            <label for="credentialPassword">密码</label>
            <div class="field-row">
              <input id="credentialPassword" type="password" readonly />
              <button id="copyPassword" type="button">复制</button>
            </div>
            <label class="reveal"><input id="showPassword" type="checkbox" /> <span>显示密码</span></label>
          </section>
        </div>
      </main>

      <div id="versionSettingsDialog" class="dialog-backdrop hidden" role="presentation">
        <section class="version-dialog" role="dialog" aria-modal="true" aria-labelledby="versionDialogTitle">
          <div class="dialog-heading">
            <div><span class="eyebrow">BUILD</span><h2 id="versionDialogTitle">构建版本信息</h2></div>
            <button id="closeVersionSettings" class="icon-button" type="button" title="关闭" aria-label="关闭">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
            </button>
          </div>
          <form id="versionForm" class="settings-form">
            <a class="plugin-store-link" href="https://chromewebstore.google.com/detail/unipass/gjphikebcceegfolnbfncepfmjnhdkam" target="_blank" rel="noopener noreferrer">商店插件版本<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg></a>
            <input id="pluginVersionOverride" type="text" readonly aria-label="构建 manifest 版号" />
            <p class="settings-help">此处不能修改网络提交版号；网络请求始终使用构建物 manifest 的 version。</p>
            <div class="version-status"><span>当前使用</span><strong id="effectivePluginVersion">检查中</strong><small id="pluginVersionSource"></small></div>
          </form>
        </section>
      </div>

      <footer class="statusbar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.4 2.8 7.6 7 9 4.2-1.4 7-4.6 7-9V6z" /><path d="m9 12 2 2 4-4" /></svg>
        <p id="status" class="status" role="status">密码不会写入本地存储</p>
      </footer>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
